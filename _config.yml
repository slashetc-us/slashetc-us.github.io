title: "/etc (SlashETC)"
description: "Personal Page of Michael J. Ford"
author:
  name: "Michael J. Ford"
  url: "https://www.slashetc.us"

baseurl: /

source: .
destination: ./_site
permalink: /:year/:month/:title/
paginate: 3
paginate_path: /page/:num/

# Build settings
markdown: kramdown

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

future: true
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

# Custom variables
owner : "Michael J. Ford"
year : "2019"
twitter_username : Michael_J_Ford

# Google Tracking
google_analytics:

# Exclude from processing
exclude:
   - .gitignore
   - .gitlab-ci
   - license.md
   - README.md
   - Gemfile
   - Gemfile.lock
   - build/
